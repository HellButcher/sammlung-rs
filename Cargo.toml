[package]
name = "sammlung"
version = "0.1.1"
license = "MIT OR Apache-2.0"
authors = ["Christoph Hommelsheim <main@chommel.en>"]
repository = "https://github.com/HellButcher/sammlung-rs.git"
description = "Lightweight, cache-friendly zero-dependency collection types for Rust — bit sets, sorted maps, and sorted sets backed by vectors."
edition = "2024"
readme = "README.md"
keywords = ["bitset", "data-structures", "vecset", "vecmap", "collections"]
categories = ["data-structures"]

[features]
default = ["std"]
std = []
unstable = []

[dependencies]

[dev-dependencies]
#criterion = { version = "0.8", features = ["html_reports", "plotters"] }
hibitset = "0.6"

#[[bench]]
#name = "benchmarks"
#harness = false
